
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfólio profissional de Valéria Galdino Ferreira — estudante de Cibersegurança, projetos em Python e Segurança da Informação.">
  <title>Valéria Galdino | Portfólio</title>

  <style>
    :root {
      --bg: #100820;
      --bg-light: #1b1034;
      --panel: rgba(39, 20, 67, 0.82);
      --pink: #ff69d4;
      --pink-light: #ffb6ed;
      --purple: #b78aff;
      --blue: #8d8aff;
      --text: #fff5ff;
      --muted: #d2c1e8;
      --border: rgba(255, 151, 237, 0.35);
      --glow: 0 0 22px rgba(255, 75, 214, 0.32);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 10%, #4b176f 0%, transparent 38%),
        radial-gradient(ellipse at 85% 30%, #30206b 0%, transparent 40%),
        linear-gradient(145deg, #100820, #1a0d32 55%, #281044);
      line-height: 1.7;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      z-index: -1;
      background-image:
        radial-gradient(circle, #ffb6ed 1px, transparent 1.5px),
        radial-gradient(circle, #a78bfa 1px, transparent 1.5px);
      background-size: 85px 85px, 125px 125px;
      background-position: 0 0, 35px 45px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, 92%);
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(18, 8, 34, .9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 5px 24px rgba(0, 0, 0, .2);
    }

    .navbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--pink-light);
      letter-spacing: .5px;
    }

    .brand span {
      display: block;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text);
      font-size: .9rem;
      transition: .25s;
    }

    nav a:hover {
      color: var(--pink);
      text-shadow: 0 0 12px var(--pink);
    }

    .hero {
      min-height: 680px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 55px;
      padding: 75px 0;
    }

    .eyebrow {
      color: var(--pink);
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: .78rem;
      font-weight: 800;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(2.8rem, 6vw, 5rem);
      line-height: 1.05;
      margin-bottom: 22px;
      color: white;
    }

    h1 span {
      color: var(--pink-light);
      text-shadow: 0 0 25px rgba(255, 105, 212, .55);
    }

    .hero-text {
      color: var(--muted);
      font-size: 1.08rem;
      max-width: 590px;
      margin-bottom: 30px;
    }

    .hero-text strong {
      color: var(--pink-light);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 24px;
      border-radius: 30px;
      border: 1px solid var(--pink);
      color: white;
      font-weight: 700;
      transition: .3s;
      cursor: pointer;
    }

    .button.primary {
      background: linear-gradient(110deg, #e94fc0, #9d5be7);
      box-shadow: var(--glow);
    }

    .button.secondary {
      background: rgba(255,255,255,.05);
    }

    .button:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 28px rgba(255, 105, 212, .55);
    }

    .profile-area {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .profile-frame {
      width: min(350px, 78vw);
      aspect-ratio: 1;
      padding: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff64d7, #a77aff, #ffb3e9);
      box-shadow:
        0 0 20px #f65bd4,
        0 0 60px rgba(172, 95, 255, .55);
      animation: float 5s ease-in-out infinite;
    }

    .profile-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      border: 5px solid #24103b;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    section {
      padding: 85px 0;
      scroll-margin-top: 85px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title p {
      color: var(--pink);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: .75rem;
      font-weight: 800;
    }

    .section-title h2 {
      font-size: clamp(2rem, 4vw, 3rem);
      margin-top: 8px;
    }

    .section-title h2 span {
      color: var(--pink-light);
    }

    .about-box {
      max-width: 900px;
      margin: auto;
      padding: 35px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--glow);
    }

    .about-box p {
      color: var(--muted);
      margin-bottom: 15px;
    }

    .about-box strong {
      color: var(--pink-light);
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .project-card {
      display: flex;
      flex-direction: column;
      min-height: 350px;
      padding: 27px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(67, 35, 101, .9), rgba(27, 15, 49, .95));
      border: 1px solid var(--border);
      box-shadow: 0 12px 35px rgba(0,0,0,.2);
      transition: .3s;
    }

    .project-card:hover {
      transform: translateY(-9px);
      border-color: var(--pink);
      box-shadow: 0 0 28px rgba(255, 105, 212, .28);
    }

    .project-type {
      color: var(--pink);
      text-transform: uppercase;
      font-size: .72rem;
      letter-spacing: 2px;
      font-weight: 800;
      margin-bottom: 17px;
    }

    .project-card h3 {
      font-size: 1.35rem;
      line-height: 1.3;
      margin-bottom: 15px;
      color: var(--pink-light);
    }

    .project-card p {
      color: var(--muted);
      font-size: .94rem;
      margin-bottom: 20px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
      margin-bottom: 22px;
    }

    .tag {
      padding: 5px 11px;
      border: 1px solid rgba(255, 153, 234, .45);
      border-radius: 30px;
      color: #f5d9ff;
      font-size: .75rem;
    }

    .project-link {
      color: var(--pink-light);
      font-weight: 800;
      transition: .2s;
    }

    .project-link:hover {
      color: white;
      text-shadow: 0 0 12px var(--pink);
    }

    .skills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .skill {
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(40, 22, 66, .75);
      transition: .3s;
    }

    .skill:hover {
      border-color: var(--pink);
      transform: translateY(-5px);
    }

    .skill h3 {
      color: var(--pink-light);
      margin-bottom: 8px;
    }

    .skill p {
      color: var(--muted);
      font-size: .9rem;
    }

    .journey {
      max-width: 800px;
      margin: auto;
      border-left: 2px solid var(--pink);
      padding-left: 30px;
    }

    .journey-item {
      position: relative;
      margin-bottom: 35px;
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .journey-item::before {
      content: "";
      position: absolute;
      left: -39px;
      top: 27px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 15px var(--pink);
    }

    .journey-item h3 {
      color: var(--pink-light);
      margin-bottom: 7px;
    }

    .journey-item p {
      color: var(--muted);
    }

    .contact-box
